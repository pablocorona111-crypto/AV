<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AV Control | Grupo Ortiz</title>
    <script>
      // Aplica el tema ANTES del primer pintado para que no se vea el flash blanco al recargar
      // en modo oscuro. Tiene que coincidir con la logica de `src/lib/tema.ts`.
      (function () {
        try {
          var guardado = localStorage.getItem("av-control:tema");
          var oscuro =
            guardado === "oscuro" ||
            (guardado !== "claro" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (oscuro) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = oscuro ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
